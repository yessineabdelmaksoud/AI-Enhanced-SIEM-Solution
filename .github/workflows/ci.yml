name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: FastAPI (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/fastapi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            app/fastapi/requirements.txt
            app/fastapi/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check

      - name: Test (pytest)
        run: pytest

  shell:
    name: Shell scripts (bash -n + shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check (bash -n)
        run: find scripts -name '*.sh' -print0 | xargs -0 -n1 bash -n

      - name: ShellCheck (errors only)
        run: |
          shellcheck --version
          find scripts -name '*.sh' -print0 | xargs -0 shellcheck --severity=error
